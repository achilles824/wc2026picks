<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1a6b3a; --green-mid: #2d9e5f; --gold: #c9a227; --gold-l: #f5d97e;
  --dark: #0d1b12; --surface: #f4f6f0; --surface2: #e8ede2;
  --red: #c0392b; --text: #1a1f17; --muted: #6b7a65;
  --border: rgba(0,0,0,0.12); --r: 10px;
  --fd: 'Bebas Neue', sans-serif; --fb: 'DM Sans', sans-serif;
}
body { font-family: var(--fb); background: var(--dark); color: var(--text); min-height: 100vh; }

.hdr {
  background: var(--dark); padding: .8rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2px solid var(--green); position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap; gap: 8px;
}
.logo { font-family: var(--fd); font-size: 1.5rem; color: #fff; letter-spacing: 2px; }
.logo span { color: var(--gold); }
.back-btn {
  background: transparent; border: 1px solid rgba(255,255,255,.2);
  color: rgba(255,255,255,.6); padding: 6px 13px; border-radius: 6px;
  cursor: pointer; font-family: var(--fb); font-size: 13px; font-weight: 500;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  transition: all .15s;
}
.back-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

.main { padding: 1.5rem; max-width: 760px; margin: 0 auto; }

/* Progress bar */
.progress-card {
  background: var(--surface); border-radius: var(--r);
  padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
}
.progress-text { flex: 1; min-width: 160px; }
.progress-title { font-family: var(--fd); font-size: 1.8rem; color: var(--dark); letter-spacing: 2px; line-height: 1; }
.progress-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.progress-bar-wrap { flex: 2; min-width: 180px; }
.progress-bar-track { height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--green-mid)); border-radius: 5px; transition: width .4s ease; }
.progress-pct { font-size: 13px; font-weight: 600; color: var(--green); }
.ring-wrap { text-align: center; }
.ring-num { font-family: var(--fd); font-size: 2.2rem; color: var(--green); line-height: 1; }
.ring-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

/* Filters */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.filter-btn {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.65); padding: 6px 14px; border-radius: 20px;
  cursor: pointer; font-family: var(--fb); font-size: 12px; font-weight: 500;
  transition: all .15s; white-space: nowrap;
}
.filter-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
.filter-btn.active { background: var(--green); border-color: var(--green); color: #fff; }

/* Group header */
.group-hdr {
  font-family: var(--fd); font-size: 1rem; letter-spacing: 1.5px;
  color: var(--gold); padding: 6px 0; margin: 1.25rem 0 .5rem;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

/* Beer card */
.beer-card {
  background: var(--surface); border-radius: var(--r);
  padding: 12px 14px; margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 12px;
  border: 1.5px solid transparent; transition: all .2s;
  border-left: 4px solid transparent;
}
.beer-card.done { background: #e8f5ee; border-color: transparent; border-left-color: var(--green); }
.beer-card:hover { border-color: rgba(45,158,95,.25); }
.beer-card.done:hover { border-color: rgba(45,158,95,.4); }

.check-btn {
  width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
  border: 2px solid var(--border); background: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all .15s; margin-top: 2px;
}
.beer-card.done .check-btn { background: var(--green); border-color: var(--green); color: #fff; }

.beer-flag { font-size: 24px; flex-shrink: 0; line-height: 1.2; }

.beer-info { flex: 1; min-width: 0; }
.beer-name {
  font-weight: 700; font-size: 15px; color: var(--text); margin-bottom: 2px;
  transition: all .15s;
}
.beer-card.done .beer-name { text-decoration: line-through; color: var(--muted); }
.beer-meta { font-size: 12px; color: var(--muted); }
.beer-where {
  display: inline-block; margin-top: 4px; font-size: 11px;
  background: var(--surface2); color: var(--muted); padding: 2px 8px;
  border-radius: 10px;
}

.note-area { margin-top: 8px; }
.note-display {
  font-size: 12px; color: var(--muted); font-style: italic;
  background: var(--surface2); padding: 6px 10px; border-radius: 6px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.note-display span { flex: 1; }
.note-edit-row { display: flex; gap: 6px; margin-top: 6px; }
.note-input {
  flex: 1; padding: 7px 10px; border: 1.5px solid var(--border);
  border-radius: 6px; font-family: var(--fb); font-size: 13px;
  background: #fff; outline: none; color: var(--text);
}
.note-input:focus { border-color: var(--green); }
.btn-sm {
  padding: 6px 12px; border-radius: 6px; font-family: var(--fb);
  font-size: 12px; font-weight: 600; cursor: pointer; border: none;
  white-space: nowrap;
}
.btn-save { background: var(--green); color: #fff; }
.btn-cancel { background: var(--surface2); color: var(--muted); }
.note-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); padding: 4px 8px; border-radius: 6px;
  font-size: 11px; cursor: pointer; font-family: var(--fb);
  flex-shrink: 0; transition: all .15s; margin-top: 2px;
}
.note-btn:hover { border-color: var(--green); color: var(--green); }

/* Sync status */
.sync-bar {
  text-align: center; font-size: 11px; padding: 10px;
  color: rgba(255,255,255,.3); margin-top: 1rem;
}
.sync-bar.syncing { color: var(--gold); }
.sync-bar.error { color: var(--red); }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--green); color: #fff; padding: 10px 24px; border-radius: 30px;
  font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none;
  transition: all .3s; z-index: 9999; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Win banner */
.win-banner {
  background: linear-gradient(135deg, #1a6b3a, #2d9e5f);
  border-radius: var(--r); padding: 2rem; text-align: center;
  margin-bottom: 1.5rem; display: none;
}
.win-banner.show { display: block; }
.win-banner h2 { font-family: var(--fd); font-size: 2.5rem; color: #fff; letter-spacing: 2px; }
.win-banner p { color: rgba(255,255,255,.8); font-size: 14px; margin-top: 6px; }

.spin-wrap { text-align: center; padding: 4rem; color: rgba(255,255,255,.4); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.1); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .main { padding: 1rem; }
  .beer-flag { font-size: 20px; }
  .progress-card { gap: 1rem; }
}
</style>

<script>
const BEERS = [
  // Group A
  { flag:"🇲🇽", country:"Mexico",         group:"A", beer:"Modelo Especial",             where:"Anywhere" },
  { flag:"🇿🇦", country:"South Africa",   group:"A", beer:"Castle Lager",                where:"Spec's" },
  { flag:"🇰🇷", country:"South Korea",    group:"A", beer:"Hite",                        where:"H-Mart" },
  { flag:"🇨🇿", country:"Czechia",        group:"A", beer:"Pilsner Urquell",             where:"Spec's" },
  // Group B
  { flag:"🇨🇦", country:"Canada",         group:"B", beer:"Molson Canadian",             where:"Spec's" },
  { flag:"🇧🇦", country:"Bosnia & Herz.", group:"B", beer:"Sarajevsko",                  where:"European import" },
  { flag:"🇶🇦", country:"Qatar",          group:"B", beer:"Qatari Dibs (N/A malt)",     where:"Middle Eastern grocers" },
  { flag:"🇨🇭", country:"Switzerland",    group:"B", beer:"Boxer Lager",                 where:"Spec's" },
  // Group C
  { flag:"🇧🇷", country:"Brazil",         group:"C", beer:"Brahma",                      where:"Spec's" },
  { flag:"🇲🇦", country:"Morocco",        group:"C", beer:"Casablanca Beer",             where:"Spec's" },
  { flag:"🇭🇹", country:"Haiti",          group:"C", beer:"Prestige Beer",               where:"Caribbean markets" },
  { flag:"🏴󠁧󠁢󠁳󠁣󠁴󠁿", country:"Scotland",       group:"C", beer:"Innis & Gunn Original",    where:"Spec's" },
  // Group D
  { flag:"🇺🇸", country:"USA",            group:"D", beer:"Shiner Bock",                 where:"Anywhere" },
  { flag:"🇵🇾", country:"Paraguay",       group:"D", beer:"Brahma Paraguay",             where:"Sub Brahma" },
  { flag:"🇦🇺", country:"Australia",      group:"D", beer:"Coopers Sparkling Ale",       where:"Spec's" },
  { flag:"🇹🇷", country:"Türkiye",        group:"D", beer:"Efes Pilsen",                 where:"Spec's" },
  // Group E
  { flag:"🇩🇪", country:"Germany",        group:"E", beer:"Paulaner Hefeweizen",         where:"Spec's" },
  { flag:"🇨🇼", country:"Curaçao",        group:"E", beer:"Amstel Bright",               where:"Caribbean markets" },
  { flag:"🇨🇮", country:"Côte d'Ivoire",  group:"E", beer:"Castel",                      where:"African import shops" },
  { flag:"🇪🇨", country:"Ecuador",        group:"E", beer:"Pilsener Ecuador",            where:"Hillcroft" },
  // Group F
  { flag:"🇳🇱", country:"Netherlands",    group:"F", beer:"Heineken",                    where:"Anywhere" },
  { flag:"🇯🇵", country:"Japan",          group:"F", beer:"Sapporo",                     where:"Spec's" },
  { flag:"🇸🇪", country:"Sweden",         group:"F", beer:"Carlsberg",                   where:"Spec's" },
  { flag:"🇹🇳", country:"Tunisia",        group:"F", beer:"Celtia",                      where:"Specialty / sub Kronenbourg" },
  // Group G
  { flag:"🇧🇪", country:"Belgium",        group:"G", beer:"Duvel",                       where:"Spec's" },
  { flag:"🇪🇬", country:"Egypt",          group:"G", beer:"Stella Artois",               where:"Anywhere" },
  { flag:"🇮🇷", country:"Iran",           group:"G", beer:"Delster (N/A malt)",          where:"Middle Eastern grocers" },
  { flag:"🇳🇿", country:"New Zealand",    group:"G", beer:"Steinlager",                  where:"Spec's" },
  // Group H
  { flag:"🇪🇸", country:"Spain",          group:"H", beer:"Estrella Damm",               where:"Spec's" },
  { flag:"🇨🇻", country:"Cape Verde",     group:"H", beer:"Super Bock",                  where:"Spec's" },
  { flag:"🇸🇦", country:"Saudi Arabia",   group:"H", beer:"Barbican (N/A malt)",         where:"Middle Eastern grocers" },
  { flag:"🇺🇾", country:"Uruguay",        group:"H", beer:"Patricia",                    where:"Specialty / sub Brahma" },
  // Group I
  { flag:"🇫🇷", country:"France",         group:"I", beer:"Kronenbourg 1664",            where:"Spec's" },
  { flag:"🇸🇳", country:"Senegal",        group:"I", beer:"Guinness Foreign Extra Stout",where:"Spec's" },
  { flag:"🇮🇶", country:"Iraq",           group:"I", beer:"Farida (N/A malt)",           where:"Middle Eastern grocers" },
  { flag:"🇳🇴", country:"Norway",         group:"I", beer:"Hansa Pilsner",               where:"Specialty" },
  // Group J
  { flag:"🇦🇷", country:"Argentina",      group:"J", beer:"Quilmes",                     where:"Spec's" },
  { flag:"🇩🇿", country:"Algeria",        group:"J", beer:"Kronenbourg 1664",            where:"Spec's" },
  { flag:"🇦🇹", country:"Austria",        group:"J", beer:"Stiegl Goldbräu",             where:"Spec's" },
  { flag:"🇯🇴", country:"Jordan",         group:"J", beer:"Petra Beer",                  where:"Middle Eastern grocers" },
  // Group K
  { flag:"🇵🇹", country:"Portugal",       group:"K", beer:"Super Bock",                  where:"Spec's" },
  { flag:"🇨🇩", country:"Congo DR",       group:"K", beer:"Primus Congo",                where:"African import shops" },
  { flag:"🇺🇿", country:"Uzbekistan",     group:"K", beer:"Sarbast",                     where:"Specialty" },
  { flag:"🇨🇴", country:"Colombia",       group:"K", beer:"Águila",                      where:"Latin markets" },
  // Group L
  { flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", country:"England",        group:"L", beer:"Fuller's London Pride",    where:"Spec's" },
  { flag:"🇭🇷", country:"Croatia",        group:"L", beer:"Karlovačko",                  where:"Specialty import" },
  { flag:"🇬🇭", country:"Ghana",          group:"L", beer:"Guinness Foreign Extra Stout",where:"Spec's" },
  { flag:"🇵🇦", country:"Panama",         group:"L", beer:"Balboa",                      where:"Hillcroft / Latin markets" },
];

const DB_PATH = 'beer-tracker-2026';
let db, trackerData = { drank: {}, notes: {} }, currentFilter = 'all', editingNote = null, unsubscribe = null;

function initApp() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    subscribeToTracker();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div style="color:#c0392b;font-size:14px;text-align:center;padding:2rem">Firebase error: ' + e.message + '</div>';
  }
}

function subscribeToTracker() {
  unsubscribe = db.collection('meta').doc(DB_PATH).onSnapshot(doc => {
    trackerData = doc.exists ? doc.data() : { drank: {}, notes: {} };
    trackerData.drank = trackerData.drank || {};
    trackerData.notes = trackerData.notes || {};
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderAll();
  }, err => {
    setSyncStatus('error', '⚠️ Connection error — ' + err.message);
  });
}

async function toggleDrank(country) {
  const next = !trackerData.drank[country];
  trackerData.drank[country] = next;
  renderAll();
  setSyncStatus('syncing', '⏳ Saving...');
  try {
    await db.collection('meta').doc(DB_PATH).set(
      { drank: { [country]: next } },
      { merge: true }
    );
    setSyncStatus('ok', '🟢 Live — changes sync for everyone instantly');
    if (next) toast('🍺 ' + country + ' checked off!');
  } catch(e) {
    setSyncStatus('error', '⚠️ Save failed — ' + e.message);
  }
}

async function saveNote(country, text) {
  trackerData.notes[country] = text;
  editingNote = null;
  renderAll();
  try {
    await db.collection('meta').doc(DB_PATH).set(
      { notes: { [country]: text } },
      { merge: true }
    );
  } catch(e) { toast('Note save failed'); }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderList();
}

function renderAll() {
  renderProgress();
  renderList();
}

function renderProgress() {
  const done = BEERS.filter(b => trackerData.drank[b.country]).length;
  const pct = Math.round(done / BEERS.length * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = done + ' of ' + BEERS.length + ' beers downed';
  document.getElementById('prog-num').textContent = pct + '%';
  document.getElementById('btn-remaining').textContent = 'Remaining (' + (BEERS.length - done) + ')';
  document.getElementById('btn-done').textContent = 'Done (' + done + ')';
  document.getElementById('win-banner').classList.toggle('show', done === BEERS.length);
}

function renderList() {
  const done = country => trackerData.drank[country];
  let filtered = BEERS.filter(b => {
    if (currentFilter === 'done') return done(b.country);
    if (currentFilter === 'remaining') return !done(b.country);
    if (currentFilter.startsWith('group-')) return b.group === currentFilter.replace('group-','');
    return true;
  });

  const list = document.getElementById('beer-list');
  if (!filtered.length) {
    list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,.3);padding:3rem;font-size:14px">' +
      (currentFilter === 'done' ? 'Nothing checked off yet. Go drink.' : '🎉 All done!') + '</div>';
    return;
  }

  // Group by World Cup group
  const byGroup = {};
  filtered.forEach(b => {
    if (!byGroup[b.group]) byGroup[b.group] = [];
    byGroup[b.group].push(b);
  });

  let html = '';
  const showGroupHeaders = !currentFilter.startsWith('group-');
  Object.keys(byGroup).sort().forEach(gid => {
    if (showGroupHeaders) {
      html += `<div class="group-hdr">GROUP ${gid}</div>`;
    }
    byGroup[gid].forEach(b => {
      const isDone = done(b.country);
      const note = trackerData.notes[b.country] || '';
      const isEditing = editingNote === b.country;
      html += `
        <div class="beer-card ${isDone ? 'done' : ''}" id="card-${b.country.replace(/[^a-z]/gi,'')}">
          <button class="check-btn" onclick="toggleDrank('${b.country}')">${isDone ? '✓' : ''}</button>
          <div class="beer-flag">${b.flag}</div>
          <div class="beer-info">
            <div class="beer-name">${b.beer}</div>
            <div class="beer-meta">${b.country}</div>
            <span class="beer-where">📍 ${b.where}</span>
            <div class="note-area">
              ${isEditing ? `
                <div class="note-edit-row">
                  <input class="note-input" id="note-input-${b.country.replace(/[^a-z]/gi,'')}" placeholder="Add a tasting note..." value="${esc(note)}" onkeydown="if(event.key==='Enter') saveNoteFromInput('${b.country}')" />
                  <button class="btn-sm btn-save" onclick="saveNoteFromInput('${b.country}')">Save</button>
                  <button class="btn-sm btn-cancel" onclick="cancelNote()">✕</button>
                </div>
              ` : note ? `
                <div class="note-display">
                  <span>💬 ${esc(note)}</span>
                  <button class="note-btn" onclick="startEditNote('${b.country}', '${esc(note).replace(/'/g,"\\'")}')">✏️</button>
                </div>
              ` : `
                <button class="note-btn" onclick="startEditNote('${b.country}', '')">📝 Add note</button>
              `}
            </div>
          </div>
        </div>`;
    });
  });
  list.innerHTML = html;

  // Focus note input if editing
  if (editingNote) {
    const inp = document.getElementById('note-input-' + editingNote.replace(/[^a-z]/gi,''));
    if (inp) { inp.focus(); inp.select(); }
  }
}

function startEditNote(country, current) {
  editingNote = country;
  renderList();
}

function cancelNote() {
  editingNote = null;
  renderList();
}

function saveNoteFromInput(country) {
  const inp = document.getElementById('note-input-' + country.replace(/[^a-z]/gi,''));
  const val = inp ? inp.value.trim() : '';
  saveNote(country, val);
}

function setSyncStatus(type, msg) {
  const el = document.getElementById('sync-bar');
  el.textContent = msg;
  el.className = 'sync-bar' + (type === 'syncing' ? ' syncing' : type === 'error' ? ' error' : '');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('load', initApp);
</script>
</body>
</html>
